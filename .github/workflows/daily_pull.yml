name: Near-realtime LI-COR + NEWA pull

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron has ~5–15 min jitter on top,
    # so expect ~15–30 min effective latency from sensor to dashboard.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pull_date:
        description: "Date to pull (YYYY-MM-DD). Leave blank for rolling yesterday+today window."
        required: false
        default: ""

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull LI-COR tower data
        id: licor
        continue-on-error: true
        env:
          LICOR_TOKEN: ${{ secrets.LICOR_TOKEN }}
          LICOR_DEVICE_SN: ${{ vars.LICOR_DEVICE_SN || '22411541' }}
          PULL_DATE: ${{ github.event.inputs.pull_date }}
        run: python scripts/pull_daily.py

      - name: Pull NEWA Geneva (AgriTech Gates) data
        id: newa
        continue-on-error: true
        env:
          PULL_DATE: ${{ github.event.inputs.pull_date }}
        run: python scripts/pull_newa_daily.py

      - name: Fail run if both pulls failed
        if: steps.licor.outcome == 'failure' && steps.newa.outcome == 'failure'
        run: |
          echo "Both LI-COR and NEWA pulls failed — flagging the run as failed."
          exit 1

      - name: Update archive and prune stale raw files
        # Rolls aged-out data into data/archive/tower_hourly_archive.csv (temp + RH,
        # hourly) BEFORE deleting raw licor day-files older than the retention window.
        # Idempotent — safe to run every cycle.
        run: python scripts/build_archive.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull latest in case another scheduled run landed between our checkout and push
          git pull --rebase origin main || true
          # -A so pruned (deleted) day-files and the archive are all staged, not just adds.
          git add -A data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: auto-pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

concurrency:
  group: realtime-pull
  cancel-in-progress: false
